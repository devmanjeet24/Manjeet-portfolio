[project]
name = "portfolio-api"
version = "0.1.0"
description = "Chat assistant backend for the portfolio site (FastAPI, pgvector)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "SIM"]
ignore = ["S101", "B008"]  # asserts in tests; FastAPI's Depends() default arguments

[tool.ruff.lint.isort]
known-third-party = ["alembic"]  # our migrations folder is also called alembic

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
